[project]
name = "saisie-commandes"
version = "0.1.0"
description = "Saisie des bons de commande reçus par l'ADV en commandes de vente."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "pydantic>=2.14.3",
    "pymupdf>=1.28.2,<2",
]

[project.scripts]
saisie-commandes = "saisie_commandes.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E501", "W", "I", "UP", "B"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--cov"]

[tool.coverage.run]
# Mesurée sur les seuls référentiels et règles métier, lecture des valeurs imprimées comprise
# (PRD #1, « Décisions de test »).
source = ["saisie_commandes.referentiels", "saisie_commandes.regles", "saisie_commandes.valeurs"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
